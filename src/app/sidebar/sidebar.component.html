<!--
  [AULA · Sidebar como componente]
  Este <nav> ficava dentro do app.html. Ao extrair para <app-sidebar>, cada arquivo
  passou a ter uma responsabilidade: aqui é navegação; no app.html é só o layout.
  O componente fica FORA do router-outlet (no app.html), então não é recriado a
  cada navegação.
-->
<nav class="sidebar" data-label="nav.sidebar · menu lateral com routerLink e routerLinkActive">
  <!--
    [Conceito 3 — routerLink] Navega sem recarregar a página (SPA). Um <a href> comum faria
    requisição nova ao servidor e perderia todo o estado dos signals.
    [Conceito 4 — routerLinkActive] Aplica a classe "ativo" quando a URL do link está ativa.
    O match é por PREFIXO: "/chat" ficaria ativo também em "/chat/123". Por isso
    [routerLinkActiveOptions]="{ exact: true }": ativo só se a URL for exatamente "/chat".
  -->
  <a
    routerLink="/chat"
    routerLinkActive="ativo"
    [routerLinkActiveOptions]="{ exact: true }"
    data-label="a · routerLink fixo: abre uma conversa nova"
    >+ Nova conversa</a
  >

  @if (chat.chats().length === 0) {
    <p class="vazio">Nenhuma conversa ainda.</p>
  }

  <!--
    [Conceito 3 — routerLink com parâmetro] Forma de array: ['/chat', c.id] vira "/chat/<id>".
    O array evita montar string na mão e já cuida de caracteres especiais.
    [Control flow] @for com `track c.id`: identifica cada item pela chave estável,
    então o Angular só mexe no DOM do que realmente mudou.
  -->
  @for (c of chat.chats(); track c.id) {
    <a
      [routerLink]="['/chat', c.id]"
      routerLinkActive="ativo"
      [attr.data-label]="'a · routerLink com parâmetro: /chat/' + c.id"
      >{{ c.titulo }}</a
    >
  }

  <a
    routerLink="/configuracoes"
    routerLinkActive="ativo"
    class="config"
    data-label="a · routerLink fixo: tela do prompt do sistema"
    >Configurações</a
  >
</nav>
