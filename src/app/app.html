<!--
  [AULA · Componente raiz = "casca" da aplicação]
  A sidebar é outro componente (<app-sidebar>) e fica FORA do router-outlet,
  então não é recriada a cada navegação. Só a área <main> troca de conteúdo
  conforme a rota. Aqui não há mais routerLink: eles migraram para a sidebar.
-->
<div class="layout">
  <app-sidebar />

  <main class="conteudo">
    <!-- [Conceito 1 — router-outlet] Marca ONDE o componente da rota ativa será renderizado.
         /chat e /chat/:id -> ChatComponent; /configuracoes -> SystemPromptComponent. -->
    <router-outlet
      data-label="router-outlet · aqui o Angular renderiza o componente da rota ativa"
    />
  </main>
</div>
